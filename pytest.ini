[pytest]
# 测试只在 tests/ 下。**必须显式限定**，否则裸跑 `pytest` 会从仓库根递归，
# 把 `artifacts/tmp/` 下历次验收留下的 git 树副本（`a7_parent_*`、`gk_r17_head`
# 等 500+ 个目录，里面各有一份旧的 `tests/` 与 `mmagent/`）一并收集 →
# 同名测试模块 `import file mismatch` + 旧代码 `ImportError`，
# 表现为「143 errors during collection」，看起来像代码坏了，实际是搜索范围错了。
# 第 27 轮实测过一次：漏写 `tests` 参数导致总闸在收集阶段就中断。
testpaths = tests

# 双保险：即使有人显式传了根路径，也不再进这些目录。
# `artifacts/tmp/` 是一次性产物（每次 `--basetemp=artifacts/tmp/bt_<tag>` 新建一个），
# 里面可能含完整仓库副本；`.venv` 是解释器环境。
norecursedirs = artifacts .git .venv __pycache__ *.egg-info node_modules
